<!DOCTYPE html>
<html lang="id">
<head>

<body>

  <div class="sb-head">
    <div class="sb-logo">
      <span class="sb-logo-icon">⬡</span>
      core<span style="color:var(--accent)">.</span>api
    </div>

    <button class="sb-close" onclick="closeSidebar()">✕</button>
  </div>

  <nav class="sb-nav">
    <div class="sb-item" onclick="window.location.href='/'">
      <span class="sb-item-icon">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <path d="M9 22V12h6v10"/>
        </svg>
      </span>
      <span class="sb-item-label">Home</span>
    </div>

    <div class="sb-item active" onclick="window.location.href='/uploader'">
      <span class="sb-item-icon">⇧</span>
      <span class="sb-item-label">Uploader</span>
    </div>
  </nav>
</aside>

<nav class="navbar">
  <div class="nav-left">
    <button class="menu-btn" id="menuBtn" onclick="toggleSidebar()">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <div class="nav-brand">
      <span style="color:var(--accent)">⬡</span>
      core<span class="nav-dot">.</span>api
    </div>
  </div>
</nav>

<div class="stars" id="stars"></div>

<div class="up-wrap">

  <div class="up-title">File Uploader</div>
  <div class="up-sub">
    Upload file kamu, dapatkan link download langsung. Simpel & cepat.
  </div>

  <div class="up-badges">
    <span class="up-badge">⏱ Expired 24 jam</span>
    <span class="up-badge">📦 Maks 50MB</span>
  </div>

  <div class="up-dropzone" id="upDropzone">
    <div class="up-dropzone-icon">⇧</div>
    <div class="up-dropzone-title">Tap untuk pilih file</div>
    <div class="up-dropzone-sub">atau drag & drop di sini</div>
  </div>

  <input type="file" id="upFileInput" style="display:none"/>

  <div id="upFileItemWrap"></div>
  <div id="upErrorWrap"></div>
  <div id="upResultWrap"></div>

  <div class="up-note">
    File otomatis terhapus setelah 24 jam.<br>
    <span>core.api</span> — Created By Nixx.
  </div>

</div>
